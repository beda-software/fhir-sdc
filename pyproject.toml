[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["htmlcov", "locales", "resources", "requirements", "embed"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "sdc"]

[tool.autohooks]
mode = "pipenv"
pre-commit = ["autohooks.plugins.ruff.format", "autohooks.plugins.ruff"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARN"
addopts = "--color=yes"
asyncio_mode = "auto"

